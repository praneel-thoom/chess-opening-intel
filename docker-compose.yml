services:
  dagster:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 3000
        CMD ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./dagster_home:/app/dagster_home
    environment:
      DAGSTER_HOME: /app/dagster_home
